<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Live Hub</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body data-view="scores">
    <div class="app-container">
        <header class="main-header">
            <div class="logo">
                <i class="fa-solid fa-basketball" aria-hidden="true"></i>
                <h1>NBA Live Hub</h1>
            </div>
            <nav class="view-tabs" role="tablist" aria-label="View">
                <button type="button" class="view-tab" role="tab" id="tab-scores" data-view="scores" aria-controls="scores-view" aria-selected="true">Scores</button>
                <button type="button" class="view-tab" role="tab" id="tab-standings" data-view="standings" aria-controls="standings" aria-selected="false" tabindex="-1">Standings</button>
            </nav>
            <div class="date-navigator scores-only">
                <button id="prev-day" class="nav-btn" aria-label="Previous day"><i
                        class="fa-solid fa-chevron-left"></i></button>
                <label class="date-display">
                    <span id="current-date">Today</span>
                    <input type="date" id="date-picker" aria-label="Pick a date">
                </label>
                <button id="next-day" class="nav-btn" aria-label="Next day"><i
                        class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="header-actions">
                <button id="today-btn" class="text-btn scores-only">Today</button>
                <button id="refresh-btn" class="icon-btn" aria-label="Refresh">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </header>

        <div id="scores-view" class="view-panel scores-only" role="tabpanel" aria-labelledby="tab-scores">
        <section id="top-performers" class="top-performers" aria-labelledby="top-title" hidden>
            <h2 id="top-title" class="section-title">Top performers</h2>
            <ol id="top-list" class="top-list"></ol>
        </section>

        <section aria-labelledby="games-title">
            <h2 id="games-title" class="section-title">Games <span id="games-count" class="count"></span></h2>
            <div id="games-grid" class="games-grid" aria-live="polite">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading games…</p>
                </div>
            </div>
        </section>
        </div>

        <section id="standings" class="view-panel standings-only" role="tabpanel" aria-labelledby="tab-standings">
            <h2 class="sr-only">Standings</h2>
            <div id="standings-body" class="standings-body" aria-live="polite"></div>
        </section>

        <footer class="main-footer">
            <p>Data from ESPN. Not affiliated with the National Basketball Association.</p>
        </footer>
    </div>

    <!-- Templates for JS to populate -->
    <template id="game-card-template">
        <article class="game-card">
            <div class="game-status">
                <span class="status-badge"></span>
                <span class="fav-tag" hidden><i class="fa-solid fa-star" aria-hidden="true"></i> My team</span>
                <span class="game-clock"></span>
            </div>
            <div class="teams-container">
                <div class="team away-team">
                    <img src="" alt="" class="team-logo away-logo">
                    <div class="name-record">
                        <span class="team-name away-name"></span>
                        <button class="fav-btn away-fav" type="button" aria-pressed="false"><i class="fa-regular fa-star" aria-hidden="true"></i></button>
                        <span class="team-record away-record"></span>
                    </div>
                    <div class="team-score away-score"></div>
                </div>
                <div class="team home-team">
                    <img src="" alt="" class="team-logo home-logo">
                    <div class="name-record">
                        <span class="team-name home-name"></span>
                        <button class="fav-btn home-fav" type="button" aria-pressed="false"><i class="fa-regular fa-star" aria-hidden="true"></i></button>
                        <span class="team-record home-record"></span>
                    </div>
                    <div class="team-score home-score"></div>
                </div>
            </div>
            <div class="leaders"></div>
            <button class="card-open" type="button">Box score</button>
        </article>
    </template>

    <dialog id="game-dialog" class="game-dialog" aria-labelledby="dialog-title">
        <div class="dialog-head">
            <h2 id="dialog-title"></h2>
            <button class="icon-btn dialog-close" type="button" aria-label="Close box score">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div id="dialog-body" class="dialog-body"></div>
    </dialog>

    <dialog id="player-dialog" class="player-dialog" aria-labelledby="player-title">
        <button class="icon-btn dialog-close" type="button" aria-label="Close player card">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div id="player-body"></div>
    </dialog>

    <script src="app.js"></script>
</body>

</html>
